---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: strict-sni-profile
spec:
  # This is the key setting to enforce SNI
  sniStrict: true

  # Optional: Enforce modern TLS versions for better security
  minVersion: VersionTLS12
  cipherSuites:
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1304_SHA256
