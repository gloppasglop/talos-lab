apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: default-issuer
spec:
  acme:
    # You must replace this email address with your own.
    email: gloppasglop@glop.pasglop
    # If the ACME server supports profiles, you can specify the profile name here.
    # See #acme-certificate-profiles below.
    server: https://ca-01.glop.pasglop/acme/acme/directory
    privateKeySecretRef:
      name: ca-01-account-key
    caBundle: 
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
