apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: paltform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: lab
                  url: https://kubernetes.default.svc
          - git:
              repoURL: https://git.glop.pasglop/gloppasglop/talos-lab.git
              revision: HEAD
              directories:
                - path: "{{ .cluster }}/kustomize/components/*"
  template:
    metadata:
      name: "{{ .cluster }}-{{ index .path.segments 3 }}"
    spec:
      project: "platform"
      source:
        repoURL: https://git.glop.pasglop/gloppasglop/talos-lab.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        server: "{{ .url}}"
        namespace: "{{ index .path.segments 3 }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
